name: Update GitHub Stats

on:
  schedule:
    #run at 21:00 UTC every day which is 00:00 EAT Kenya Time(UTC+3)
    - cron: "0 21 * * *"
  #Allows manual trigger
  workflow_dispatch:

#allow GitHub Actions to update repository files
permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner}}&show_icons=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Language
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats
        run: |
          curl "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=tokyonight" \
          -o profile/streak.svg
      

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add profile/*.svg
          git commit -m "update stats" || echo "no changes"

          git push 
