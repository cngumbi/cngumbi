name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.C_MAINTOKEN }}

      - run: mkdir -p profile

      - name: Download stats image
        run: |
          curl "https://github-readme-stats.vercel.app/api?username=cngumbi&show_icons=true&theme=tokyonight" \
          -o profile/stats.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add profile/stats.svg
          git commit -m "update stats" || echo "no changes"

          git push https://x-access-token:${{ secrets.C_MAINTOKEN }}@github.com/${{ github.repository }}.git HEAD:main
