name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.C_MAINTOKEN }}

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate GitHub Stats
        run: |
          curl -H "Authorization: token ${{ secrets.C_MAINTOKEN }}" \
          "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight" \
          -o profile/stats.svg

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
      
          git add profile/stats.svg
          git commit -m "Update GitHub Stats $(date)" || echo "No changes"
      
          git push https://x-access-token:${{ secrets.C_MAINTOKEN }}@github.com/${{ github.repository }}.git HEAD:main
