name: Update GitHub Stats

on:
  schedule:
    #run at 21:00 UTC every day which is 00:00 EAT Kenya Time(UTC+3)
    - cron: "0 21 * * *"
  #Allows manual trigger
  workflow_dispatch:

#allow GitHub Actions to update repository files
permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          
      - name: Create profile directory
        run: mkdir -p profile
        
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner}}&show_icons=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          faill_on_error: true

      - name: Generate Top Language
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Streak Stats
        env:
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          curl -fLsS --retry 3 \
          "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=tokyonight" \
          -o profile/streak.svg

          test -s profile/streak.svg
          grep -q "<svg" profile/streak.svg
      

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0 
          fi
          
          git commit -m "update stats" || echo "no changes"
          git push 
